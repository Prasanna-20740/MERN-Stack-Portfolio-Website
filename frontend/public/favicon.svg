<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Rounded Squircle Base -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#favGrad)" filter="url(#favGlow)" />
  <!-- Inner Subtle Border -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />
  <!-- Monogram Text "P" -->
  <text x="50%" y="54%" font-family="'Plus Jakarta Sans', 'Outfit', -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="-0.02em">P</text>
  <!-- Accent Tech Dot -->
  <circle cx="47" cy="17" r="4.5" fill="#34d399" stroke="#ffffff" stroke-width="1.5" />
</svg>
